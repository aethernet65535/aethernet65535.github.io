<html>
	<head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            body { 
                margin: 20px;
                line-height: 1.4;
                background-color: #fff; 
                color: #000; 
            }

            pre { 
                white-space: pre-wrap;
                word-wrap: break-word;
                font-family: monospace;
                font-size: 1rem;
                margin: 0;
            }

            @media (min-width: 800px) {
                body { 
                    max-width: 900px;
                    margin-left: 40px;
                    margin-right: auto;

		<title>$$tpl.result[1] = tpl.arg.title;$$</title>
		<script type = "text/javascript">
			MathJax = {
				tex: {
					inlineMath: [['$','$'],['\\(','\\']]
				     }
				  };
		</script>
		<script type = "text/javascript" id = "MathJax-script" async
			src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
		</script>
	</head>

    <body>
<pre><code class="language-text">$$ tpl.result[1] = tpl.arg.content; $$</code></pre>

        <hr>

        <div style="text-align: left">
<pre><code class="language-text">Publish: $$
tpl.result[1] = os.date("%Y-%m-%d", tpl.arg.date);
$$$$
tpl.result[1] = tpl.arg.change and
("\nLast Change: %s"):format(tpl.arg.change)
or "";
$$</code></pre>
        </div>
